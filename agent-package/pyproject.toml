[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skybeat-agent"
version = "1.0.0"
description = "Outbound-only Linux telemetry agent for SkyBeat"
requires-python = ">=3.12,<3.13"
dependencies = ["psutil>=7,<8", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-psutil>=7,<8"]

[project.scripts]
skybeat-agent = "skybeat_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
