name: skybeat

x-app: &app
  build:
    context: .
    dockerfile: deployment/docker/Dockerfile.server
  env_file:
    - .env
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SKYBEAT_MYSQL_DATABASE:?set SKYBEAT_MYSQL_DATABASE in .env}
      MYSQL_USER: ${SKYBEAT_MYSQL_RUNTIME_USER:?set SKYBEAT_MYSQL_RUNTIME_USER in .env}
      MYSQL_PASSWORD: ${SKYBEAT_MYSQL_RUNTIME_PASSWORD:?set SKYBEAT_MYSQL_RUNTIME_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${SKYBEAT_MYSQL_ROOT_PASSWORD:?set SKYBEAT_MYSQL_ROOT_PASSWORD in .env}
      SKYBEAT_MYSQL_MIGRATION_USER: ${SKYBEAT_MYSQL_MIGRATION_USER:?set SKYBEAT_MYSQL_MIGRATION_USER in .env}
      SKYBEAT_MYSQL_MIGRATION_PASSWORD: ${SKYBEAT_MYSQL_MIGRATION_PASSWORD:?set SKYBEAT_MYSQL_MIGRATION_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/mysql/01-create-migration-user.sh:/docker-entrypoint-initdb.d/01-create-migration-user.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    <<: *app
    profiles: ["migrate"]
    restart: "no"
    environment:
      SKYBEAT_DATABASE_URL: ${SKYBEAT_MIGRATION_DATABASE_URL:?set SKYBEAT_MIGRATION_DATABASE_URL in .env}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

  api:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/livez', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
  data:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
